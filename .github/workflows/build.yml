name: Build & Release

on:
  push:
    tags:
      - 'v*'

env:
  NODE_VERSION: '22'
  JAVA_VERSION: '17'
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Dorg.gradle.caching=true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - run: npx expo-doctor
      - run: npx tsc --noEmit
      - run: npx jest --ci

  build-android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # ── Gradle cache ──────────────────────────────────────────
      # Biggest win: caches Maven artifacts + pre-compiled build outputs
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches/
            ~/.gradle/wrapper/
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # ── Android SDK cache ─────────────────────────────────────
      - name: Cache Android SDK
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.ANDROID_HOME || '~/.android' }}/platforms/
            ${{ env.ANDROID_HOME || '~/.android' }}/build-tools/
            ${{ env.ANDROID_HOME || '~/.android' }}/ndk/
            ${{ env.ANDROID_HOME || '~/.android' }}/cmake/
          key: ${{ runner.os }}-android-sdk-${{ hashFiles('android/**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-android-sdk-

      # ── Expo prebuild cache ───────────────────────────────────
      # The android/ dir is deterministic from Expo config; avoid regen
      - name: Cache Expo prebuild
        id: cache-expo-prebuild
        uses: actions/cache@v4
        with:
          path: android/
          key: ${{ runner.os }}-expo-prebuild-${{ hashFiles('app.json', 'app.config.js', 'app.config.ts', 'package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-expo-prebuild-

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install deps
        run: npm ci

      - name: Expo prebuild
        # Skip if cached; generates android/ from Expo config
        if: steps.cache-expo-prebuild.outputs.cache-hit != 'true'
        run: npx expo prebuild --platform android --no-install

      - name: Build APK (Gradle)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: |
          VERSION=$(node -p "require('./app.json').expo.version")
          mv android/app/build/outputs/apk/debug/app-debug.apk \
            kernel-mobile-v2-${VERSION}.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernel-mobile-v2-android
          path: kernel-mobile-v2-*.apk

  release:
    needs: [build-android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate changelog
        id: changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -z "$PREV_TAG" ]; then
            git log --oneline --no-decorate > CHANGELOG.md
          else
            git log --oneline --no-decorate ${PREV_TAG}..HEAD > CHANGELOG.md
          fi
          {
            echo 'changelog<<EOF'
            cat CHANGELOG.md
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: kernel-mobile-v2-android
          path: dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "kernel-mobile-v2 ${{ github.ref_name }}"
          tag_name: ${{ github.ref_name }}
          body: |
            ## kernel-mobile-v2 ${{ github.ref_name }}

            ### Changes
            ${{ steps.changelog.outputs.changelog }}

            ### Downloads
            - **Android APK**: kernel-mobile-v2-*.apk
          files: dist/kernel-mobile-v2-*.apk
          draft: false
          prerelease: false
